// HNS + LVL Configuration File
// Autor: Bstr # Thynuviel

// Habilitar/deshabilitar el plugin
hns_lvl_enabled "1"

// Nivel máximo
hns_lvl_max_level "150"

// HP base (nivel 1)
hns_lvl_base_hp "100"

// HP adicional por nivel
hns_lvl_hp_per_level "1"

// Frags base para subir del nivel 1 al 2
hns_lvl_base_frags "20"

// Frags adicionales por cada nivel siguiente
hns_lvl_frags_per_level "10"

// Nivel requerido para usar HE
hns_lvl_he_required_level "10"

// Happy Hour habilitado
hns_lvl_happyhour_enabled "1"

// Debug mode
hns_lvl_debug "0"

// Prefix para mensajes
hns_lvl_prefix "[HNS LVL]"

// Party
hns_lvl_max_party_members "5"

// Skills
hns_lvl_points_per_level "1"

// Carnage
hns_lvl_carnage_rounds "3"
hns_lvl_carnage_points_per_kill "1"

// Parachute
hns_lvl_parachute_enabled "1"
hns_lvl_parachute_fallspeed "100"
hns_lvl_parachute_detach "1"

// HUD
hns_lvl_hud_enabled "1"
hns_lvl_hud_update_interval "1.0"